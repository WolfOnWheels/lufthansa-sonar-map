<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lufthansa Sonar Map</title>
<link rel="stylesheet" href="sonar.css?v=20261023f">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  #hud { left: 12px; bottom: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.5; width: 250px; }
  #hud b { color: var(--plane); }
  #hud .sep { margin: 8px 0; border-top: 1px solid var(--border); }
  #err { color: #ff8080; }
  .track { display: grid; grid-template-columns: 14px 1fr 34px; align-items: center; gap: 6px; font-size: 12px; }
  .track .sw { width: 10px; height: 10px; border-radius: 50%; }
  .track .name { display: flex; flex-direction: column; }
  .track .name small { opacity: .65; font-size: 11px; }
  .track input { grid-column: 2 / 4; width: 100%; accent-color: var(--plane); margin: 0 0 4px; }
  .track output { text-align: right; opacity: .8; }
  #hud #play { width: 100%; padding: 6px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<svg id="map"></svg>

<div id="hud" class="panel">
  <div><b>Lufthansa (LH)</b> · airborne flights</div>
  <div>Flights: <span id="count">–</span> · Updated: <span id="updated">–</span></div>
  <div>Next update in <span id="next">–</span></div>
  <div id="err"></div>
  <div class="sep"></div>
  <div id="tracks"></div>
  <button id="play" disabled>Loading audio…</button>
</div>

<div id="zoom" class="panel">
  <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
  <button id="zoom-reset" title="Reset view" aria-label="Reset view">⟲</button>
</div>
<div id="now" aria-live="polite"><svg id="now-icon" viewBox="0 0 24 24" aria-hidden="true"></svg><div id="now-flight"></div><div id="now-route"></div><div id="now-alt"></div></div>
<div id="tip"></div>

<script src="sonar.js?v=20261023f"></script>
</body>
</html>
